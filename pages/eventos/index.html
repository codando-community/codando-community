<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda de Eventos | Codando Community</title>
  
  <!-- External Resources -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800;900&display=swap">
  
  <!-- Project Legacy Styles -->
  <link rel="stylesheet" href="../../styles/reset.css">
  <link rel="stylesheet" href="../../styles/global.css">
  <link rel="stylesheet" href="../../styles/header/header.css">
  
  <!-- New Eventos Page Style -->
  <link rel="stylesheet" href="eventos.css">
  
  <link rel="shortcut icon" href="../../img/codando-logo-icon.svg" type="image/x-icon">
</head>
<body>

  <!-- Header Section -->
  <header id="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-transparent fixed-top" style="background-color: rgba(11, 14, 35, 0.85) !important; backdrop-filter: blur(15px);">
      <div class="container">
        <a class="navbar-brand" href="../../index.html">
          <img src="../../img/codando-logo-icon.svg" alt="Logo Codando" style="width: 42px;">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="../../index.html#about-us">Quem somos</a></li>
            <li class="nav-item"><a class="nav-link" href="../../index.html#pilares">Pilares</a></li>
            <li class="nav-item"><a class="nav-link active" href="#">Eventos</a></li>
            <li class="nav-item"><a class="nav-link" href="../faq/faq.html">FAQ</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <!-- Hero Section -->
  <div class="eventos-hero">
    <div class="container">
      <h1>Nossa Agenda</h1>
      <p>Acompanhe os workshops, maratonas e bate-papos exclusivos da comunidade para impulsionar sua carreira em TI.</p>
    </div>
  </div>

  <!-- Main Content Section -->
  <main class="eventos-container">
    
    <!-- Dynamic Header (Sticky) -->
    <div class="sticky-header">
      <div class="container">
        <div class="search-header">
          <div class="search-bar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4b6a82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" placeholder="O que você está procurando?">
          </div>
          <div class="filter-pills">
            <button class="filter-pill active" data-filter="todos">Todos Eventos</button>
            <button class="filter-pill" data-filter="futuros">Próximos</button>
            <button class="filter-pill" data-filter="passados">Encerrados</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Events Content -->
    <div id="event-list" class="event-list">
      <!-- Logic rendered by eventos.js -->
    </div>

  </main>

  <!-- Simple Footer -->
  <footer style="margin-top: 8rem; padding: 5rem 2rem; background: rgba(255,255,255,0.015); text-align: center; border-top: 1px solid rgba(255,255,255,0.05);">
    <div class="container">
      <h3 style="color: #fff; font-weight: 800; letter-spacing: -1px; margin-bottom: 0.5rem;">Codando Community</h3>
      <p style="color: rgba(255,255,255,0.3); font-size: 0.9rem;">May the community be with you.</p>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="eventos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
